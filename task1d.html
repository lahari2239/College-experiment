<!DOCTYPE html>
<html>
  <head>
    <title>Button click events HAndler</title>
    <style>
      body{
        font-family:arial,Sans-Serif;
        Margin:40px;
      }
      button{
        padding:10px 20px;
        font-size:16px;
        Margin-right:10px;
        Cursor:pointer;
        background-color:#4CAF50;
        color:white;
        border:none;
        border-radius:4px;
      }
      button:hover{
        background-color:#45a049;
      }
      #output{
        Margin-top:20px;
        font-size:18px;
        font-weight:bold;
        color:#333;
      }
    </style>
</head>
  <body>
    <h2> Multiple Button click Events</h2>
    <button class="action-btn">Button A</button>
    <button class="action-btn">Button B</button>
    <button class="action=btn">button C</button>
    <p id="output">status:click any button above.</p>
    <script>
      const buttons=document.querySelectionAll('.action-btn');
      constoutputText=document.getElementId('output');
      buttons.ForEach(function(button){
        button.addeventListners('click',function(event){
          const clicked ButtonName=event.target.textcontent;
          outputText.textContent="You clicked:"+Clicked Button Name;
        });
      });
    </script>
  </body>
</html>
