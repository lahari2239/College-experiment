<!DOCTYPE html>
<html>
  <head>
    <title>Java Script Selectors</title>
  </head>
  <body>
    <h2 id="heading">Welcome</h2>
    <p class="text"><h1>This is the first paragraph.</h1></p>
    <p class="text"><h1>this is the second paragraph.</h1></p>
    
    <button onclick="changeContent()">Click Me</button>
    
    <script>
      function changeContent() {
        document.getElementById("heading").innerHTML = "javascript selectors";
        document.getElementsByClassName("text")[0].style.color = "blue";
        document.getElementsByTagName("p")[1].style.color = "green";
        document.querySelector("h2").style.backgroundColor = "yellow";
      }
    </script>
  </body>
</html>
