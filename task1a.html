<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Link Example</title>
  </head>
  <body>

    <h2>Linking JavaScript with HTML</h2>
    
    
    <button onclick="showmessage()">Click Me</button>
    
    <script>
      function showmessage() {
        alert("JAVASCRIPT FILE LINKED SUCCESSFULLY");
      }
    </script>

  </body>
</html>
